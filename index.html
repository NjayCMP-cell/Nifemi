<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nifemi — Apprenticeship Tracker</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="loading-bar"></div>
<div id="toast" class="hidden"></div>

<header>
  <div class="header-inner">
    <div class="logo">⚖️ <span>ApprenticeTrack</span></div>
    <div class="header-stats">
      <div class="stat" id="stat-total"></div>
      <div class="stat applied" id="stat-applied"></div>
      <div class="stat researched" id="stat-researched"></div>
      <div class="stat early" id="stat-early"></div>
    </div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍  Search firm, location..."/>
  <select id="filter-status">
    <option value="">All Statuses</option>
    <option value="RESEARCHED">Researched</option>
    <option value="APPLIED">Applied</option>
    <option value="APPLY EARLY">Apply Early</option>
    <option value="NOT STARTED">Not Started</option>
    <option value="REJECTED">Rejected</option>
    <option value="OFFER">Offer</option>
  </select>
  <select id="filter-location">
    <option value="">All Locations</option>
    <option value="London">London</option>
    <option value="Manchester">Manchester</option>
    <option value="Birmingham">Birmingham</option>
    <option value="Bristol">Bristol</option>
    <option value="Leeds">Leeds</option>
    <option value="Liverpool">Liverpool</option>
    <option value="Exeter">Exeter</option>
  </select>
  <select id="filter-type">
    <option value="">All Types</option>
    <option value="Paralegal">Paralegal → Solicitor</option>
    <option value="Email">Email Application</option>
    <option value="Tax">Tax</option>
  </select>
  <button id="btn-reset">Reset</button>
  <button id="btn-add">+ Add Firm</button>
</div>

<div class="table-wrap">
  <table id="tracker-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Firm</th>
        <th>Location</th>
        <th>Salary</th>
        <th>Requirements</th>
        <th>Deadline</th>
        <th>Type</th>
        <th>Status</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<!-- Edit Modal -->
<div id="modal-overlay" class="hidden">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <label>Status</label>
    <select id="modal-status">
      <option value="NOT STARTED">Not Started</option>
      <option value="RESEARCHED">Researched</option>
      <option value="APPLY EARLY">Apply Early</option>
      <option value="APPLIED">Applied</option>
      <option value="REJECTED">Rejected</option>
      <option value="OFFER">Offer 🎉</option>
    </select>
    <label>Notes</label>
    <textarea id="modal-notes" rows="4" placeholder="Add notes..."></textarea>
    <div class="modal-actions">
      <button id="modal-save">Save</button>
      <button id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Add Firm Modal -->
<div id="add-overlay" class="hidden">
  <div class="modal">
    <h2>ADD NEW FIRM</h2>
    <label>Firm Name *</label>
    <input type="text" id="add-firm" placeholder="e.g. Allen & Overy"/>
    <label>Location</label>
    <input type="text" id="add-location" placeholder="e.g. London, Manchester"/>
    <label>Salary</label>
    <input type="text" id="add-salary" placeholder="e.g. £26k"/>
    <label>Requirements</label>
    <input type="text" id="add-req" placeholder="e.g. ABB + 5 GCSEs"/>
    <label>Deadline</label>
    <input type="text" id="add-deadline" placeholder="e.g. Oct – Jan"/>
    <label>Type</label>
    <input type="text" id="add-type" placeholder="e.g. Paralegal → Solicitor"/>
    <label>Status</label>
    <select id="add-status">
      <option value="NOT STARTED">Not Started</option>
      <option value="RESEARCHED">Researched</option>
      <option value="APPLY EARLY">Apply Early</option>
      <option value="APPLIED">Applied</option>
      <option value="REJECTED">Rejected</option>
      <option value="OFFER">Offer 🎉</option>
    </select>
    <label>Notes</label>
    <textarea id="add-notes" rows="3" placeholder="Any notes..."></textarea>
    <div class="modal-actions">
      <button id="add-save">Add Firm</button>
      <button id="add-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
